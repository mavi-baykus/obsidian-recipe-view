name: Node.js CI build

on:
    push:
        branches:
            - "master"
    pull_request:
        branches:
            - "master"

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                node-version: 22.x
            - run: npm ci
            - run: npm run build
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                node-version: 22.x
            - run: npm ci
            - run: npm run lint
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                node-version: 22.x
            - run: npm ci
            - run: npm run test
    