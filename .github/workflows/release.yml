name: Create release for Obsidian plugin

on:
    push:
        tags:
            - "*"

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                node-version: "22.x"
            - name: Check the tag matches the plugin version
              run: |
                tag="${GITHUB_REF#refs/tags/}"
                version=$(node -p "require('./manifest.json').version")
                if [ "$tag" != "$version" ]; then
                  echo "::error::Tag $tag does not match version $version in manifest.json"
                  exit 1
                fi
            - run: npm ci
            - run: npm test
            - run: npm run build
            - name: Create release
              env:
                GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
              run: |
                tag="${GITHUB_REF#refs/tags/}"
                # The release notes are this version's section of CHANGELOG.md
                awk -v version="$tag" '/^## /{ found = ($2 == version); next } found' CHANGELOG.md > notes.md
                # Versions like 0.5.0-beta.1 are pre-releases; BRAT installs them too
                prerelease=""
                if [[ "$tag" == *-* ]]; then prerelease="--prerelease"; fi
                gh release create "$tag" --title="$tag" --notes-file notes.md $prerelease main.js manifest.json styles.css
